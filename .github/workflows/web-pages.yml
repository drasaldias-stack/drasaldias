# Reconstruye la copia publicada de la app web (carpeta docs/) cada vez que cambia app-autonoma o prototipo en main.
# GitHub Pages se configura para servir la rama main desde /docs, así que el commit que hace este flujo es lo que se publica.
# La base de la app es /<nombre del repositorio>: renombrar el repositorio no exige cambiar nada aquí.
name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app-autonoma/**'
      - 'prototipo/**'
      - 'hipotiroidismo_infografia.html'
      - '!app-autonoma/README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-autonoma/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: app-autonoma
      - name: Pruebas y tipos
        run: npm test && npm run typecheck
        working-directory: app-autonoma
      - name: Exportar bajo /<repositorio>
        run: npm run web:pages
        working-directory: app-autonoma
        env:
          CI: '1'
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: Subir la copia publicada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then echo "Sin cambios que publicar"; else git commit -m "Publicar la app web en GitHub Pages" && git push; fi
