<title>Ruta 90</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: barra con tres vistas; la vista paciente es una columna de teléfono, la del equipo un resumen sobre lista y detalle; el avance de 90 días se dibuja como una cinta métrica. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E5EBE7; --ink:#16201C; --ink-2:#51605A; --line:#CFD9D3;
  --accent:#0D5C63; --accent-ink:#FFFFFF; --accent-soft:#D7EBEC;
  --tape:#F2C12E; --tape-ink:#2B2304;
  --ok:#23704A; --ok-bg:#DCEFE3; --warn:#A85A0C; --warn-bg:#F8E7D3; --crit:#B3261E; --crit-bg:#F8DEDB; --crit-ink:#FFFFFF;
  --p-base:#0D5C63; --p-base-bg:#D7EBEC; --p-meno:#7B3B6E; --p-meno-bg:#F1DFEC; --p-lipe:#36539A; --p-lipe-bg:#DFE6F6;
  --f-display:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#151E1B; --surface-2:#1F2A26; --ink:#E3EAE6; --ink-2:#9AA8A2; --line:#2C3934;
    --accent:#67C1C4; --accent-ink:#06282A; --accent-soft:#163A3C;
    --tape:#E5B93A; --tape-ink:#231C03;
    --ok:#63C08C; --ok-bg:#16301F; --warn:#E89A4A; --warn-bg:#35240F; --crit:#F2786C; --crit-bg:#3A1A17; --crit-ink:#2A0B08;
    --p-base:#67C1C4; --p-base-bg:#163A3C; --p-meno:#DDA0CF; --p-meno-bg:#3A2034; --p-lipe:#9DB2EC; --p-lipe-bg:#1F2A47;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151E1B; --surface-2:#1F2A26; --ink:#E3EAE6; --ink-2:#9AA8A2; --line:#2C3934;
  --accent:#67C1C4; --accent-ink:#06282A; --accent-soft:#163A3C;
  --tape:#E5B93A; --tape-ink:#231C03;
  --ok:#63C08C; --ok-bg:#16301F; --warn:#E89A4A; --warn-bg:#35240F; --crit:#F2786C; --crit-bg:#3A1A17; --crit-ink:#2A0B08;
  --p-base:#67C1C4; --p-base-bg:#163A3C; --p-meno:#DDA0CF; --p-meno-bg:#3A2034; --p-lipe:#9DB2EC; --p-lipe-bg:#1F2A47;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-0.01em}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.22rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
h4{font-size:.92rem;font-weight:700;margin-top:4px}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.eyebrow{font:700 .72rem/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font:800 1.2rem/1 var(--f-display);letter-spacing:-0.02em}
.brand-mark{width:36px;height:22px;flex:none}
.views{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:8px}
.views button{font:600 .9rem/1 var(--f-body);padding:9px 12px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer}
.views button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
@media (max-width:560px){.views{width:100%}.views button{flex:1;padding:9px 6px}}
.aviso{margin:0;padding:8px 16px;background:var(--warn-bg);color:var(--ink);font-size:.875rem}
.aviso span{display:block;max-width:1088px;margin:0 auto}

main{max-width:1120px;margin:0 auto;padding-block:20px 64px;padding-inline:16px;display:grid;gap:16px}
.col-tel{max-width:480px;width:100%;margin-inline:auto;display:grid;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row-between{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}

.btn{font:600 .95rem/1.1 var(--f-body);padding:11px 16px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn-sec{background:transparent;color:var(--accent);border-color:var(--line)}
.btn-sec:hover{background:var(--accent-soft);filter:none}
.btn-crit{background:var(--crit);border-color:var(--crit);color:var(--crit-ink)}
.btn-sm{padding:7px 11px;font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

select,input[type="text"],input[type="number"]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;width:100%;min-width:0}
label.campo{display:grid;gap:6px;font-weight:600;font-size:.95rem}
.campos{display:grid;gap:12px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
legend{font-weight:600;padding:0;margin-bottom:8px;font-size:.95rem}
.opciones{display:flex;flex-wrap:wrap;gap:6px}
.opciones input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opciones label{padding:8px 13px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem;background:var(--surface);color:var(--ink)}
.opciones input:checked + label{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opciones input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
label.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;padding:8px 0;border-bottom:1px solid var(--line)}
label.check input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--crit)}
.error{color:var(--crit);font-weight:600;font-size:.9rem}

.chip,.sev,.est{display:inline-flex;align-items:center;font:700 .74rem/1 var(--f-body);padding:5px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.chip.base{background:var(--p-base-bg);color:var(--p-base)}
.chip.menopausia{background:var(--p-meno-bg);color:var(--p-meno)}
.chip.lipedema{background:var(--p-lipe-bg);color:var(--p-lipe)}
.sev.crit,.est.crit{background:var(--crit-bg);color:var(--crit)}
.sev.warn,.est.warn{background:var(--warn-bg);color:var(--warn)}
.sev.info,.est.info{background:var(--surface-2);color:var(--ink-2)}
.est.ok{background:var(--ok-bg);color:var(--ok)}

.vercomo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:420px){.vercomo{grid-template-columns:minmax(0,1fr)}}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:8px}
.ptabs button{font:600 .88rem/1.1 var(--f-body);padding:9px 4px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer}
.ptabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.ptabs button.alarma{color:var(--crit)}
.estado-dia{font-size:1.05rem}
.estado-dia .num{font-weight:500}

.cinta{display:grid;gap:4px;min-width:0}
.cinta-fases{display:grid;grid-template-columns:29fr 30fr 30fr;font:700 .66rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.cinta-fases span{text-align:center;border-left:1px solid var(--line)}
.cinta-fases span:first-child{border-left:0}
.cinta svg{width:100%;height:30px;display:block}
.tape-bg{fill:var(--surface-2)}
.tape-on{fill:var(--tape)}
.tk{stroke:var(--ink-2);stroke-width:1}
.tk.on{stroke:var(--tape-ink)}
.tk-hoy{stroke:var(--ink);stroke-width:3}
.cinta-dias{position:relative;height:16px;font:500 .7rem/1 var(--f-data);color:var(--ink-2)}
.cinta-dias span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}
.cinta-dias .d1{left:0;transform:none}
.cinta-dias .d30{left:32.58%}
.cinta-dias .d60{left:66.29%}
.cinta-dias .d90{left:100%;transform:translateX(-100%)}

ul.lista,ol.lista{margin:0;padding-left:1.15em;display:grid;gap:5px}
ul.flags{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.flags li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.nota-crit{background:var(--crit-bg);color:var(--ink);padding:10px 12px;border-radius:var(--r);font-weight:600}
.aviso-urg{background:var(--crit-bg);color:var(--ink);padding:10px 12px;border-radius:var(--r);font-size:.92rem}

.graf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
figure.graf{margin:0;display:grid;gap:4px;min-width:0}
figure.graf figcaption{font-weight:600;font-size:.88rem;display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
figure.graf figcaption .num{font-weight:500;color:var(--ink-2);font-size:.8rem}
.graf svg{width:100%;height:auto;display:block}
.g-grid{stroke:var(--line);stroke-width:1;fill:none}
.g-area{fill:var(--accent);opacity:.13}
.g-line{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.g-dot{fill:var(--accent)}
.g-dot-end{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.g-txt{fill:var(--ink-2);font:11px var(--f-data)}

.eq-head{display:grid;gap:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi .v{font:700 2rem/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .v.crit{color:var(--crit)}
.kpi .l{font-size:.88rem;color:var(--ink-2)}
.embudo{display:grid;gap:6px}
.embudo-fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:.82rem;align-items:center}
.embudo-fila svg{grid-column:1 / -1;width:100%;height:8px;display:block}
.emb-bg{fill:var(--surface-2)}
.emb-on{fill:var(--accent)}

.eq-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.eq-col{display:grid;gap:16px;min-width:0}
.eq-detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);min-width:0}
@media (max-width:920px){.eq-grid{grid-template-columns:minmax(0,1fr)}.eq-detail{position:static}}
ul.alertas{list-style:none;margin:0;padding:0;display:grid}
.alerta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;border-left:4px solid var(--ink-2);border-bottom:1px solid var(--line)}
.alerta:last-child{border-bottom:0}
.alerta.crit{border-left-color:var(--crit)}
.alerta.warn{border-left-color:var(--warn)}
.alerta.info{border-left-color:var(--line)}
.alerta .txt{flex:1 1 220px;min-width:0}
.alerta .quien{font-weight:700}
.linkbtn{background:none;border:0;padding:0;font:700 1rem/1.3 var(--f-body);color:var(--accent);cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
ul.pac-lista{list-style:none;margin:0;padding:0;display:grid}
.pac-fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 10px;border-bottom:1px solid var(--line)}
.pac-fila:last-child{border-bottom:0}
.pac-fila.sel{background:var(--accent-soft)}
.pac-main{display:grid;gap:6px;min-width:0}
.pac-nums{display:grid;gap:2px;justify-items:end;align-content:start;text-align:right;white-space:nowrap}
.det-sec{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}

.prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;align-items:start}
.prog .eyebrow.base{color:var(--p-base)}
.prog .eyebrow.menopausia{color:var(--p-meno)}
.prog .eyebrow.lipedema{color:var(--p-lipe)}
ol.fases-l{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:.92rem}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.calc-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.calc-out div{background:var(--surface-2);border-radius:var(--r);padding:12px;display:grid;gap:2px}
.calc-out .v{font:600 1.35rem/1.1 var(--f-data);font-variant-numeric:tabular-nums}
.calc-out .l{font-size:.82rem;color:var(--ink-2)}

#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;max-width:calc(100% - 32px);z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.18)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 36 22" aria-hidden="true">
        <rect class="tape-on" x="0" y="0" width="36" height="22" rx="3"></rect>
        <line class="tk on" x1="6" y1="0" x2="6" y2="13"></line>
        <line class="tk on" x1="12" y1="0" x2="12" y2="7"></line>
        <line class="tk on" x1="18" y1="0" x2="18" y2="13"></line>
        <line class="tk on" x1="24" y1="0" x2="24" y2="7"></line>
        <line class="tk on" x1="30" y1="0" x2="30" y2="13"></line>
      </svg>
      <span>Ruta 90</span>
    </div>
    <nav class="views" role="tablist" aria-label="Vistas">
      <button type="button" role="tab" id="tab-paciente" data-view="paciente">Paciente</button>
      <button type="button" role="tab" id="tab-equipo" data-view="equipo">Equipo</button>
      <button type="button" role="tab" id="tab-programas" data-view="programas">Programas</button>
    </nav>
  </div>
</header>
<p class="aviso"><span>Prototipo con pacientes ficticios. Los cambios se guardan solo en este navegador. No ingreses datos reales de pacientes.</span></p>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';
const KEY = 'ruta90-demo-v1';
const DIA = 86400000;
const HOY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); })();
const dias = n => HOY + n * DIA;
const diaDe = p => p.inicio == null ? 0 : Math.round((HOY - p.inicio) / DIA) + 1;
const fecha = ms => new Date(ms + DIA / 2).toLocaleDateString('es', { day: 'numeric', month: 'short' });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, dec) => (n == null || n === '' || isNaN(n)) ? 's/d' : Number(n).toLocaleString('es', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });
const fmtV = n => fmt(n, Number.isInteger(Number(n)) ? 0 : 1);
const SEV_ORDEN = { crit: 0, warn: 1, info: 2 };

/* ---------- Programas ---------- */
const PROGRAMAS = {
  base: {
    nombre: 'Base',
    paraQuien: 'Personas sedentarias, con alimentación desordenada, que quieren iniciar un cambio.',
    mide: ['Pasos por día', 'Minutos de actividad moderada por semana', 'Sesiones de fuerza por semana', 'Cintura', 'Peso, si hay meta de peso'],
    equipo: ['Médico', 'Nutrición', 'Profesional del ejercicio'],
    incluye: 'Preconsulta, consultas médicas en los días 45 y 90, seis sesiones grupales y revisión semanal de registros.',
    fases: [
      'Subir los pasos desde tu punto de partida, sumar dos sesiones cortas de fuerza desde la semana 2 y elegir dos o tres cambios de alimentación.',
      'Acercarte a 150 minutos semanales de actividad moderada y hacer fuerza dos días por semana.',
      'Armar tu plan para las semanas difíciles, espaciar el contacto con el equipo y preparar el paso a mantenimiento.'
    ],
    alarmas: ['Dolor o presión en el pecho', 'Falta de aire repentina', 'Desmayo o mareo intenso con el esfuerzo', 'Palpitaciones que no ceden', 'Temblor, sudor frío o confusión si usas insulina o sulfonilureas'],
    graficos: [['pasos', 'Pasos por día', null], ['minutos', 'Minutos de actividad por semana', null], ['cintura', 'Cintura (cm)', null], ['peso', 'Peso (kg)', null]]
  },
  menopausia: {
    nombre: 'Menopausia',
    paraQuien: 'Mujeres en perimenopausia o posmenopausia, sedentarias, con síntomas o cambios en su composición corporal.',
    mide: ['Molestia por bochornos (1 a 10)', 'Bochornos por día', 'Calidad del sueño', 'Cintura', 'Sesiones de fuerza'],
    equipo: ['Médico', 'Nutrición', 'Profesional de entrenamiento de fuerza', 'Psicología para el módulo de terapia cognitivo-conductual'],
    incluye: 'Todo lo del programa Base, más el módulo grupal de terapia cognitivo-conductual para bochornos.',
    fases: [
      'Empezar el entrenamiento de fuerza guiado, llevar el diario de bochornos y sueño, e iniciar el módulo de terapia cognitivo-conductual.',
      'Aumentar las cargas de forma progresiva, repartir la proteína en el día y cubrir calcio y vitamina D con alimentos.',
      'Dejar armado tu plan de entrenamiento, revisar el tratamiento en consulta y preparar el paso a mantenimiento.'
    ],
    alarmas: ['Sangrado después de 12 meses sin regla', 'Dolor o hinchazón de una pantorrilla', 'Dolor de pecho o falta de aire repentina', 'Pérdida de fuerza o del habla', 'Nódulo nuevo en una mama', 'Ánimo muy bajo o ideas de muerte'],
    graficos: [['molestia', 'Molestia por bochornos (1 a 10)', [0, 10]], ['bochornosDia', 'Bochornos por día', null], ['pasos', 'Pasos por día', null], ['cintura', 'Cintura (cm)', null]]
  },
  lipedema: {
    nombre: 'Lipedema',
    paraQuien: 'Pacientes con diagnóstico clínico de lipedema confirmado en la preconsulta, con o sin obesidad.',
    mide: ['Dolor (0 a 10)', 'Pesadez (0 a 10)', 'Contorno de muslo en un punto fijo', 'Días con compresión', 'Sesiones de fuerza y bajo impacto'],
    equipo: ['Médico', 'Nutrición', 'Fisioterapia para compresión y drenaje', 'Profesional del ejercicio'],
    incluye: 'Todo lo del programa Base, más sesiones de fisioterapia para compresión y terapia descongestiva cuando se indique.',
    fases: [
      'Ajustar la compresión con fisioterapia, empezar ejercicio de bajo impacto y elegir tu patrón de alimentación.',
      'Sumar fuerza con la compresión indicada, ajustar las calorías y registrar dolor y contorno cada semana.',
      'Consolidar el autocuidado, definir el plan a largo plazo y coordinar con cirugía si corresponde.'
    ],
    alarmas: ['Hinchazón brusca de una sola pierna', 'Enrojecimiento de la piel con fiebre', 'Hinchazón de los pies que deja marca al presionar', 'Empeoramiento rápido del dolor o del volumen', 'Dolor de pecho o falta de aire repentina'],
    graficos: [['dolor', 'Dolor (0 a 10)', [0, 10]], ['pesadez', 'Pesadez (0 a 10)', [0, 10]], ['pasos', 'Pasos por día', null], ['contorno', 'Contorno de muslo (cm)', null]]
  }
};
const MANTENIMIENTO_TXT = 'Un grupo al mes, una revisión de registros al mes y una consulta cada tres meses.';

const CAMPOS_REG = {
  comun: [
    { id: 'pasos', label: 'Pasos por día (promedio de la semana)', min: 0, max: 40000, step: 100, req: true },
    { id: 'minutos', label: 'Minutos de actividad moderada en la semana', min: 0, max: 1500, step: 5, req: true },
    { id: 'fuerza', label: 'Sesiones de fuerza en la semana', min: 0, max: 14, step: 1, req: true },

function niceStep(x) {
  if (!(x > 0)) return 1;

function grafico(titulo, registros, campo, dom) {

  if (pts.length < 2) {
    return `<figure class="graf"><figcaption><span>${esc(titulo)}</span></figcaption><p class="muted small">${pts.length ? 'Un registro: ' + fmtV(pts[0].v) + '. Se necesitan al menos dos para ver la tendencia.' : 'Todavía no hay registros.'}</p></figure>`;

    const vmin = Math.min(...pts.map(p => p.v)), vmax = Math.max(...pts.map(p => p.v));
    const step = niceStep((vmax - vmin || Math.abs(vmax) * 0.1 || 1) / 2);
    y0 = Math.floor(vmin / step) * step; y1 = Math.ceil(vmax / step) * step;
    if (y0 === vmin) y0 -= step;

  const Y = v => Tm + (1 - (v - y0) / (y1 - y0)) * (H - Tm - Bm);
  const ym = (y0 + y1) / 2;

  const area = linea + ` L${X(x1).toFixed(1)} ${Y(y0).toFixed(1)} L${X(x0).toFixed(1)} ${Y(y0).toFixed(1)} Z`;

    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}: de ${fmtV(pri.v)} en la semana ${pri.s} a ${fmtV(ult.v)} en la semana ${ult.s}">

      <path class="g-line" d="${linea}"></path>

      <text class="g-txt" x="${Lm}" y="${H - 6}" text-anchor="start">Sem ${pri.s}</text>

}

      <section class="card">
        <div class="row-between"><h2>Alertas</h2><span class="small muted">${al.length} abiertas</span></div>
        ${al.length ? `<ul class="alertas">${al.map(a => `<li class="alerta ${a.sev}">${chipSev(a.sev)}<span class="txt"><button type="button" class="linkbtn" data-action="selPac" data-id="${a.p.id}">${esc(a.p.nombre)}</button><br><span class="small">${esc(a.t)}</span></span><button type="button" class="btn btn-sec btn-sm" data-action="resolver" data-alerta="${esc(a.id)}">Resolver</button></li>`).join('')}</ul>` : '<p class="muted">No hay alertas abiertas.</p>'}
      </section>
      <section class="card">
        <div class="row-between"><h2>Pacientes</h2>
          <button type="button" class="btn btn-sec btn-sm" data-action="reset">${state.confirmReset ? 'Confirmar: volver a los datos de ejemplo' : 'Restablecer ejemplo'}</button></div>
        <ul class="pac-lista">${lista.map(p => {
            const a = alertasDe(p);
            const e = semanasEsperadas(p);
            const accion = a.length ? a[0].t : (p.estado === 'mantenimiento' ? 'Revisión mensual' : 'Sin pendientes');
            const diaTxt = p.estado === 'activo' ? 'Día ' + diaDe(p) : p.estado === 'mantenimiento' ? 'Día 90+' : '';
            return `<li class="pac-fila${p.id === state.equipoSel ? ' sel' : ''}">
              <div class="pac-main">
                <div class="row"><button type="button" class="linkbtn" data-action="selPac" data-id="${p.id}">${esc(p.nombre)}</button><span class="small muted">${p.edad} años${p.ejemplo ? ' · ejemplo' : ''}</span></div>
                <div class="row">${chipProg(p.programa)}${chipEstado(p)}</div>
                <p class="small">${a.length ? chipSev(a[0].sev) + ' ' : ''}${esc(accion)}</p>
              </div>
              <div class="pac-nums">${diaTxt ? `<span class="num">${diaTxt}</span>` : ''}${p.estado === 'activo' && e ? `<span class="num small muted">Registros ${Math.min(p.registros.length, e)}/${e}</span>` : ''}</div>
            </li>`;
          }).join('')}</ul>
      </section>
    </div>
    <aside class="eq-detail" id="detalle">${detalle(getP(state.equipoSel))}</aside>
  </div>`;
}
function detalle(p) {
  if (!p) return `<section class="card"><h2>Detalle</h2><p class="muted">Elige un paciente de la lista para ver su detalle.</p></section>`;
  const d = diaDe(p), f = fase(d);
  const al = alertasDe(p);
  const meds = [p.meds.levotiroxina && 'Levotiroxina', p.meds.insulinaSU && 'Insulina o sulfonilureas', p.meds.antihipertensivo && 'Antihipertensivos', p.meds.estrogenoOral && 'Estrógenos orales'].filter(Boolean);
  let acciones = '';
  if (p.estado === 'preconsulta') {
    acciones = `<div class="det-sec"><h3>Decisión de ingreso</h3>
      ${p.pre.bloqueo ? '<p class="nota-crit">La preconsulta marcó no iniciar todavía. Aprueba solo si ya resolviste ese punto.</p>' : ''}
      <label class="campo" for="selProg">Programa al ingresar<select id="selProg">${Object.keys(PROGRAMAS).map(k => `<option value="${k}"${k === p.programa ? ' selected' : ''}>${PROGRAMAS[k].nombre}</option>`).join('')}</select></label>
      <div class="row"><button type="button" class="btn" data-action="aprobar" data-id="${p.id}">Aprobar ingreso con inicio hoy</button><button type="button" class="btn btn-sec" data-action="derivar" data-id="${p.id}">Derivar sin iniciar</button></div></div>`;
  } else if (p.estado === 'activo') {
    const b = [];
    if (!p.control30 && d >= 25) b.push(`<button type="button" class="btn btn-sec btn-sm" data-action="control" data-c="control30" data-id="${p.id}">Marcar control día 30 hecho</button>`);
    if (!p.control60 && d >= 55) b.push(`<button type="button" class="btn btn-sec btn-sm" data-action="control" data-c="control60" data-id="${p.id}">Marcar control día 60 hecho</button>`);
    if (!p.mantenimientoOfrecido) b.push(`<button type="button" class="btn btn-sec btn-sm" data-action="ofrecer" data-id="${p.id}">Registrar oferta de mantenimiento</button>`);
    if (d >= 60) b.push(`<button type="button" class="btn btn-sm" data-action="pasarMant" data-id="${p.id}">Pasar a mantenimiento</button>`);
    acciones = `<div class="det-sec"><h3>Acciones</h3><div class="row">${b.join('') || '<span class="muted small">Sin acciones pendientes en esta etapa.</span>'}</div></div>`;
  }
  return `<section class="card">
    <div class="row-between"><h2>${esc(p.nombre)}</h2><div class="row">${chipProg(p.programa)}${chipEstado(p)}</div></div>
    <p class="small muted">${p.edad} años · ${p.sexo === 'F' ? 'mujer' : 'hombre'} · meta inicial: ${esc({ actividad: 'moverse más', alimentacion: 'ordenar la alimentación', peso: 'bajar de peso', sintomas: 'mejorar síntomas' }[p.meta] || 's/d')}</p>
    ${p.estado === 'activo' ? `<p>Día <span class="num">${d}</span> de 90 · ${f.nombre}</p>${cinta(d)}` : ''}
    ${al.length ? `<div class="det-sec"><h3>Alertas abiertas</h3><ul class="flags">${al.map(a => `<li>${chipSev(a.sev)}<span>${esc(a.t)} <button type="button" class="linkbtn small" data-action="resolver" data-alerta="${esc(a.id)}">Resolver</button></span></li>`).join('')}</ul></div>` : ''}
    <div class="det-sec"><h3>Preconsulta</h3><p class="small">Programa sugerido: ${chipProg(p.pre.sugerido || p.programa)}. ${esc(p.pre.motivo)}</p>${flagsLista(p.pre.flags)}</div>
    <div class="det-sec"><h3>Medicamentos relevantes</h3><p class="small">${meds.length ? esc(meds.join(', ')) : 'Ninguno informado.'}</p></div>
    ${p.registros.length ? `<div class="det-sec"><h3>Evolución</h3>${graficos(p)}</div>` : ''}
    ${acciones}
    <div class="det-sec"><div class="row"><button type="button" class="btn btn-sec btn-sm" data-action="verComoPac" data-id="${p.id}">Ver la app como ${esc(p.nombre)}</button></div></div>
  </section>`;
}

/* ---------- Vista programas y precios ---------- */
function calcOut() {
  const c = state.calc;
  const costo = c.hora * c.hMed + c.horaEq * c.hEq + c.plat;
  const precio = costo * (1 + c.margen / 100);
  return `<div><span class="l">Costo por paciente</span><span class="v">${fmt(costo)}</span></div>
    <div><span class="l">Precio mínimo con margen</span><span class="v">${fmt(precio)}</span></div>
    <div><span class="l">Ingreso por grupo de ${fmt(c.grupo)}</span><span class="v">${fmt(precio * c.grupo)}</span></div>
    <div><span class="l">Margen por grupo</span><span class="v">${fmt((precio - costo) * c.grupo)}</span></div>`;
}
function vistaProgramas() {
  const c = state.calc;
  const num = (id, label, step) => `<label class="campo" for="calc-${id}">${label}<input id="calc-${id}" type="number" inputmode="decimal" min="0" step="${step}" value="${esc(c[id])}"></label>`;
  return `
  <div class="eq-head"><h1>Programas y precios</h1><p class="muted">Lo que vendes es el programa de 90 días. La app es el medio para entregarlo y seguirlo.</p></div>
  <div class="prog-grid">${Object.entries(PROGRAMAS).map(([k, g]) => `
    <article class="card prog">
      <span class="eyebrow ${k}">Programa</span>
      <h2>${esc(g.nombre)}</h2>
      <p>${esc(g.paraQuien)}</p>
      <h4>Estructura</h4>
      <ol class="fases-l"><li><b>Días 1 a 30, Cimientos.</b> ${esc(g.fases[0])}</li><li><b>Días 31 a 60, Progresión.</b> ${esc(g.fases[1])}</li><li><b>Días 61 a 90, Autonomía.</b> ${esc(g.fases[2])}</li></ol>
      <h4>Qué se mide</h4><ul class="lista small">${g.mide.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <h4>Equipo</h4><p class="small">${esc(g.equipo.join(', '))}.</p>
      <h4>Señales de alarma en la app</h4><ul class="lista small">${g.alarmas.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <h4>Incluye</h4><p class="small">${esc(g.incluye)}</p>
      <label class="campo" for="precio-${k}">Precio de los 90 días<input id="precio-${k}" data-precio="${k}" type="text" inputmode="decimal" placeholder="Por definir" value="${esc(state.precios[k] || '')}"></label>
    </article>`).join('')}
  </div>
  <section class="card">
    <h2>Precio mínimo por paciente</h2>
    <p class="small muted">Valores de ejemplo en unidades de tu moneda. Cambia cada número por el de tu consulta.</p>
    <div class="calc-grid">
      <label class="campo" for="calc-prog">Programa<select id="calc-prog">${Object.keys(PROGRAMAS).map(k => `<option value="${k}"${k === c.prog ? ' selected' : ''}>${PROGRAMAS[k].nombre}</option>`).join('')}</select></label>
      ${num('hora', 'Valor de tu hora de consulta', 1)}
      ${num('hMed', 'Tus horas por paciente en 90 días', 0.25)}
      ${num('horaEq', 'Valor de la hora del equipo', 1)}
      ${num('hEq', 'Horas del equipo por paciente', 0.1)}
      ${num('plat', 'Plataforma por paciente (90 días)', 1)}
      ${num('margen', 'Margen (%)', 1)}
      ${num('grupo', 'Personas por grupo', 1)}
    </div>
    <div class="calc-out" id="calcOut">${calcOut()}</div>
    <p class="small muted">Horas de ejemplo: tu preconsulta de 45 minutos y dos consultas de 30 minutos suman 1,75 horas. En el programa Base el equipo dedica 0,6 horas en seis sesiones grupales de 1 hora divididas entre 10 personas, y 1 hora en revisiones semanales de 5 minutos. Menopausia suma el módulo de terapia cognitivo-conductual y lipedema suma fisioterapia.</p>
  </section>
  <section class="card">
    <h2>Antes de usar la app con pacientes reales</h2>
    <ol class="lista">
      <li>Servidor seguro con cuentas individuales, cifrado y respaldo. Hoy los datos viven solo en este navegador.</li>
      <li>Consentimiento informado digital y política de privacidad según la ley de protección de datos de tu país.</li>
      <li>Revisión legal del límite entre app de bienestar y producto sanitario. La app sugiere y avisa; las decisiones clínicas las toma el equipo.</li>
      <li>Pagos y facturación del programa.</li>
      <li>Notificaciones en el teléfono para recordatorios y registros.</li>
      <li>Protocolo del equipo para responder alertas, con horarios publicados y el aviso de que la app no es un canal de urgencias.</li>
    </ol>
  </section>`;
}

/* ---------- Render y eventos ---------- */
const app = document.getElementById('app');
function render() {
  document.querySelectorAll('.views [data-view]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === state.view)));
  app.innerHTML = state.view === 'equipo' ? vistaEquipo() : state.view === 'programas' ? vistaProgramas() : vistaPaciente();
  if (state.focusId) { const el = document.getElementById(state.focusId); if (el) el.focus(); state.focusId = null; }
}
function arriba() { try { window.scrollTo(0, 0); } catch (e) { /* nada */ } }
let tTimer;
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.hidden = false;
  clearTimeout(tTimer); tTimer = setTimeout(() => { t.hidden = true; }, 3400);
}
function mostrarError(id, msg) { const e = document.getElementById(id); if (e) { e.textContent = msg; e.hidden = false; } }

document.querySelector('.views').addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (!b) return;
  state.view = b.dataset.view; state.confirmReset = false;
  render(); arriba();
});

const ACCIONES = {
  ptab: b => { state.ptab = b.dataset.tab; render(); },
  nuevaPre: () => { state.pre = { step: 0, a: {}, res: null }; render(); arriba(); },
  preCancelar: () => { state.pre = null; render(); arriba(); },
  preAtras: () => { if (state.pre.res) state.pre.res = null; else if (state.pre.step > 0) state.pre.step--; render(); arriba(); },
  preEnviar: () => {
    const a = state.pre.a, r = state.pre.res;
    const p = nuevoP({ id: 'n' + Date.now(), nombre: String(a.nombre).trim(), edad: Number(a.edad), sexo: a.sexo, programa: r.programa, estado: 'preconsulta', creado: HOY, meta: a.meta, ejemplo: false,
      meds: { levotiroxina: a.medLevo === 'si', insulinaSU: a.medInsulina === 'si', antihipertensivo: a.medPresion === 'si', estrogenoOral: a.sexo === 'F' && a.medEstrogeno === 'si' },
      pre: { motivo: r.motivo, flags: r.flags, sugerido: r.programa, bloqueo: r.bloqueo, respuestas: Object.assign({}, a) } });
    state.pacientes.push(p);
    state.pacienteId = p.id; state.equipoSel = p.id; state.pre = null;
    guardar(); render(); arriba();
    toast('Preconsulta enviada. Revísala en Equipo clínico.');
  },
  selPac: b => {
    state.equipoSel = b.dataset.id; render();
    if (window.matchMedia('(max-width: 920px)').matches) { const el = document.getElementById('detalle'); if (el) el.scrollIntoView({ block: 'start' }); }
  },
  resolver: b => { state.resueltas[b.dataset.alerta] = true; guardar(); render(); toast('Alerta resuelta'); },
  aprobar: b => {
    const p = getP(b.dataset.id); const sel = document.getElementById('selProg');
    p.programa = sel ? sel.value : p.programa; p.estado = 'activo'; p.inicio = HOY; p.registros = [];
    if (p.meds.estrogenoOral && !p.estrogenoInicio) p.estrogenoInicio = null;
    guardar(); render(); toast(p.nombre + ' ingresó al programa ' + PROGRAMAS[p.programa].nombre + '. Día 1 hoy.');
  },
  derivar: b => { const p = getP(b.dataset.id); p.estado = 'derivado'; guardar(); render(); toast(p.nombre + ' quedó derivado sin iniciar el programa.'); },
  control: b => { const p = getP(b.dataset.id); p[b.dataset.c] = true; guardar(); render(); toast('Control registrado'); },
  ofrecer: b => { const p = getP(b.dataset.id); p.mantenimientoOfrecido = true; guardar(); render(); toast('Oferta de mantenimiento registrada'); },
  pasarMant: b => { const p = getP(b.dataset.id); p.estado = 'mantenimiento'; p.mantenimientoOfrecido = true; guardar(); render(); toast(p.nombre + ' pasó a mantenimiento.'); },
  verComoPac: b => { state.view = 'paciente'; state.pacienteId = b.dataset.id; state.ptab = 'inicio'; state.pre = null; render(); arriba(); },
  reset: () => {
    if (!state.confirmReset) { state.confirmReset = true; render(); return; }
    Object.assign(state, estadoInicial(), { confirmReset: false, equipoSel: null, pacienteId: 'p1', ptab: 'inicio', pre: null });
    guardar(); render(); toast('Datos de ejemplo restablecidos');
  }
};
app.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || !app.contains(b)) return;
  const fn = ACCIONES[b.dataset.action];
  if (fn) fn(b);
});

app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.change === 'verComo') { state.pacienteId = t.value; state.ptab = 'inicio'; render(); return; }
  if (t.name && t.name.indexOf('pre-') === 0 && state.pre) {
    state.pre.a[t.name.slice(4)] = t.value;
    if (t.type === 'radio') { state.focusId = t.id; render(); }
    return;
  }
  if (t.id === 'calc-prog') {
    state.calc.prog = t.value; Object.assign(state.calc, DEF_CALC[t.value]);
    guardar(); render(); state.focusId = null;
  }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.name && t.name.indexOf('pre-') === 0 && state.pre && t.type !== 'radio') { state.pre.a[t.name.slice(4)] = t.value; return; }
  if (t.dataset.precio) { state.precios[t.dataset.precio] = t.value; guardar(); return; }
  if (t.id && t.id.indexOf('calc-') === 0 && t.id !== 'calc-prog') {
    const k = t.id.slice(5); const v = Number(String(t.value).replace(',', '.'));
    state.calc[k] = isNaN(v) ? 0 : v;
    const out = document.getElementById('calcOut'); if (out) out.innerHTML = calcOut();
    guardar();
  }
});

app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'formPre') {
    const pre = state.pre, a = pre.a;
    const pasos = pasosVisibles(a);
    const st = pasos[Math.min(pre.step, pasos.length - 1)];
    const faltan = [];
    camposVisibles(st, a).forEach(c => {
      const el = f.elements['pre-' + c.id];
      const v = el ? String(el.value).trim() : '';
      a[c.id] = v;
      if (c.req && v === '') faltan.push(c.label);
      else if (c.tipo === 'numero' && v !== '' && (isNaN(Number(v)) || Number(v) < c.min || Number(v) > c.max)) faltan.push(c.label + ' (entre ' + c.min + ' y ' + c.max + ')');
    });
    if (faltan.length) { mostrarError('preError', 'Falta responder o corregir: ' + faltan.join('; ') + '.'); return; }
    const total = pasosVisibles(a).length;
    if (pre.step >= total - 1) pre.res = evaluarPre(a);
    else pre.step++;
    render(); arriba();
    return;
  }
  if (f.id === 'formRegistro') {
    const p = getP(state.pacienteId);
    const sem = semanaActual(p);
    const reg = { s: sem }; const errs = [];
    camposDe(p.programa).forEach(c => {
      const raw = String(f.elements[c.id].value).trim().replace(',', '.');
      if (raw === '') { if (c.req) errs.push(c.label); reg[c.id] = null; return; }
      const v = Number(raw);
      if (isNaN(v) || v < c.min || v > c.max) { errs.push(c.label + ' (entre ' + c.min + ' y ' + c.max + ')'); return; }
      reg[c.id] = v;
    });
    if (errs.length) { mostrarError('regError', 'Revisa: ' + errs.join('; ') + '.'); return; }
    p.registros = p.registros.filter(r => r.s !== sem).concat(reg).sort((x, y) => x.s - y.s);
    guardar(); state.ptab = 'progreso'; render(); arriba();
    toast('Registro de la semana ' + sem + ' guardado');
    return;
  }
  if (f.id === 'formAlarma') {
    const items = [...f.querySelectorAll('input[name="alm"]:checked')].map(i => i.value);
    if (!items.length) { mostrarError('almError', 'Marca al menos un síntoma para enviar el aviso.'); return; }
    const p = getP(state.pacienteId);
    p.alarmas.push({ fecha: HOY, items });
    guardar(); render();
    toast('Aviso registrado. Aparece como urgente en el panel del equipo.');
  }
});

render();
})();
</script>
