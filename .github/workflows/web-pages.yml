# Reconstruye la copia publicada de la app web (en la raíz del repositorio) cada vez que cambia app-autonoma en main.
# GitHub Pages sirve la rama main desde la raíz, así que el commit que hace este flujo es lo que se publica.
# La base de la app es /<nombre del repositorio>: renombrar el repositorio no exige cambiar nada aquí.
name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app-autonoma/**'
      - '.github/workflows/web-pages.yml'
  # Ejecutar a mano (pestaña Actions, «Run workflow») después de renombrar el repositorio: el cambio de nombre no
  # dispara el flujo y la copia publicada lleva la base del nombre anterior hasta que se vuelva a exportar.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-autonoma/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: app-autonoma
      - name: Pruebas y tipos
        run: npm test && npm run typecheck
        working-directory: app-autonoma
      - name: Exportar bajo /<repositorio>
        run: npm run web:pages
        working-directory: app-autonoma
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          # Base de la app: /<nombre del repositorio>. Con un dominio propio configurado en GitHub Pages, crear la
          # variable de repositorio PAGES_BASE con el valor / para publicar en la raíz del dominio.
          EXPO_BASE_URL: ${{ vars.PAGES_BASE || format('/{0}', github.event.repository.name) }}
      - name: Subir la copia publicada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # El checkout trae el commit que disparó el flujo, no la punta de la rama (que puede incluir ya el commit
          # del bot de la ejecución anterior). Por eso el commit se construye sobre la punta real: se trae, se vuelven
          # a copiar los artefactos recién exportados desde app-autonoma/dist y se sube; si la rama avanza entre
          # medio, se repite desde la punta nueva. El script garantiza que los ocho artefactos existen.
          for intento in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            node app-autonoma/scripts/publicar-pages.js --solo-copiar
            git add -A -- index.html 404.html .nojekyll manifest.webmanifest favicon.ico _expo assets icons
            if git diff --cached --quiet; then echo "Sin cambios que publicar"; exit 0; fi
            git commit -q -m "Publicar la app web en GitHub Pages"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "La rama avanzó durante el intento $intento; se repite sobre la punta nueva"
          done
          echo "No se pudo subir la copia publicada tras tres intentos" >&2
          exit 1
